<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Guess The Champion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top-bar">
  <div class="site-title">
    <h1>Guess The Champion</h1>
    <p>Who won each competition?</p>
  </div>

  <div class="year-controls">
    <button id="prevYear">◀</button>
    <select id="yearSelect"></select>
    <button id="nextYear">▶</button>
    <button id="randomYear">🎲</button>
  </div>
</header>

<main id="cards"></main>

<footer>
  <div class="footer-actions">
    <button id="submit">Send</button>
    <button id="share" style="display:none;">Share</button>
    <button id="shareImage" style="display:none;">Share Image</button>
  </div>

  <textarea
    id="shareBox"
    readonly
    style="display:none; width:100%; height:120px;"
  ></textarea>
</footer>

<script src="app.js" defer></script>

<canvas
  id="shareCanvas"
  width="600"
  height="600"
  style="display:none;"
></canvas>
</body>
</html>
