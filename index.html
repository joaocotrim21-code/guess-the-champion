<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Guess The Champion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top-bar">
  <div class="site-title">
    <h1>Guess The Champion</h1>
    <p>Who won each competition?</p>
  </div>

  <div class="year-controls">
    <button id="prevYear">◀</button>
    <select id="yearSelect"></select>
    <button id="nextYear">▶</button>
    <button id="randomYear">🎲</button>
  </div>
</header>

<main id="cards"></main>

<footer>
  <button id="submit">Send</button>
  <div id="result"></div>
  <button id="share" style="display:none;">Share</button>
<textarea id="shareBox" readonly style="display:none; width:100%; height:120px;"></textarea>

</footer>

<script src="app.js" defer></script>
</body>
</html>
